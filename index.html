<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TECH RELAY GRAND FINALE</title>
<style>
:root{--bg:#05070f;--c:#00f0ff;--m:#ff2bd6;--ok:#39ff88;--bad:#ff3860;--tx:#d8e6ff}
*{box-sizing:border-box;margin:0}
body{min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 0,#10204a,var(--bg) 60%);color:var(--tx);font-family:"Segoe UI",system-ui,monospace;padding:16px;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;background:repeating-linear-gradient(0deg,#ffffff06 0 1px,transparent 1px 3px);pointer-events:none}
main{width:min(520px,100%);text-align:center}
h1{font-size:clamp(1.5rem,6vw,2.2rem);letter-spacing:.15em;color:var(--c);text-shadow:0 0 12px var(--c),0 0 32px var(--m)}
.sub{margin:6px 0 22px;font-size:.8rem;letter-spacing:.3em;color:var(--m)}
.card{border:1px solid #00f0ff55;border-radius:16px;padding:22px;background:#0a1226cc;box-shadow:0 0 30px #00f0ff22 inset,0 0 30px #ff2bd622}
.pin{display:flex;gap:14px;justify-content:center;margin-bottom:16px}
.pin span{width:min(80px,17vw);height:min(96px,21vw);display:grid;place-items:center;font-size:2.8rem;border:2px solid var(--c);border-radius:10px;background:#00f0ff0d;box-shadow:0 0 10px #00f0ff55}
.pin span.f{background:#00f0ff22}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:6px}
button{font:inherit;font-size:1.3rem;padding:14px 0;color:var(--tx);background:#0e1a3a;border:1px solid #00f0ff55;border-radius:10px;cursor:pointer;transition:.15s}
button:hover:not(:disabled){background:#00f0ff22;box-shadow:0 0 12px var(--c)}
button:disabled{opacity:.35;cursor:not-allowed}
.go{color:var(--ok);border-color:#39ff8855}.clr{color:var(--bad);border-color:#ff386055}
.att{display:flex;gap:8px;justify-content:center;margin:16px 0 4px}
.att i{width:14px;height:14px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok)}
.att i.u{background:#222c4a;box-shadow:none}
#msg{min-height:1.6em;margin-top:10px;font-size:.95rem}
.win .pin,.win .pad,.win .att,.lock .pin,.lock .pad{display:none}
.lock #msg{font-size:clamp(1.6rem,7vw,2.4rem);padding:30px 0}
#win{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:24px;z-index:9;background:radial-gradient(circle at 50% 40%,#0b4d2a,#02130a 70%)}
#win.on{display:flex}
#win h2{font-size:clamp(2.6rem,11vw,7rem);line-height:1.05;letter-spacing:.06em;color:var(--ok);text-shadow:0 0 20px var(--ok),0 0 60px var(--c);animation:p 1.4s ease-in-out infinite}
#win p{font-size:clamp(1.2rem,4vw,2.4rem);color:var(--tx);letter-spacing:.2em}
@keyframes p{50%{transform:scale(1.06)}}
.shake{animation:s .4s}
@keyframes s{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.win #msg{color:var(--ok);font-size:1.25rem;text-shadow:0 0 14px var(--ok)}
.win .pin span{border-color:var(--ok);box-shadow:0 0 16px var(--ok)}
.lock #msg{color:var(--bad);font-size:1.1rem;text-shadow:0 0 14px var(--bad)}
.lock .pin span{border-color:var(--bad);box-shadow:0 0 16px var(--bad)}
</style>
</head>
<body>
<main>
  <h1>TECH RELAY</h1>
  <div class="sub">GRAND FINALE</div>
  <div class="card" id="card">
    <div class="pin" id="pin"><span></span><span></span><span></span><span></span></div>
    <div class="pad" id="pad"></div>
    <div class="att" id="att"></div>
    <div id="msg">Enter the 4-digit PIN. 5 attempts only.</div>
  </div>
</main>
<div id="win"><h2>🎉 CONGRATULATIONS! 🎉</h2><p>YOU HAVE CRACKED THE PIN</p></div>
<script>
(() => {
  const SECRET = "NzIwNQ==";            // base64 of the PIN
  const MAX = 5, KEY = "trgf_state";
  const $ = id => document.getElementById(id);
  const cells = [...$("pin").children], card = $("card"), msg = $("msg");
  let buf = "";
  let st = { used: 0, won: false };
  try { localStorage.removeItem(KEY); } catch {}   // clear old saved state from earlier version
  const save = () => {};                           // state lives in memory only: reload = fresh start

  const keys = [..."123456789", "C", "0", "OK"];
  keys.forEach(k => {
    const b = document.createElement("button");
    b.textContent = k === "OK" ? "ENTER" : k;
    b.style.fontSize = k.length > 1 ? ".9rem" : "";
    if (k === "OK") b.className = "go"; if (k === "C") b.className = "clr";
    b.onclick = () => press(k);
    $("pad").appendChild(b);
  });

  const over = () => st.won || st.used >= MAX;
  function render() {
    cells.forEach((c, i) => { c.textContent = buf[i] ? "●" : ""; c.classList.toggle("f", !!buf[i]); });
    $("att").innerHTML = Array.from({ length: MAX }, (_, i) => `<i class="${i < MAX - st.used ? "" : "u"}"></i>`).join("");
    document.querySelectorAll("button").forEach(b => b.disabled = over());
    $("win").classList.toggle("on", st.won);
    card.classList.toggle("win", st.won);
    card.classList.toggle("lock", !st.won && st.used >= MAX);
    if (st.won) msg.textContent = "🎉 Congratulations! You have cracked the PIN!";
    else if (st.used >= MAX) msg.textContent = "🔒 ACCESS LOCKED — no attempts left.";
  }

  function press(k) {
    if (over()) return;
    if (k === "C") buf = buf.slice(0, -1);
    else if (k === "OK") return submit();
    else if (buf.length < 4) buf += k;
    render();
  }

  function submit() {
    if (buf.length < 4) { msg.textContent = "PIN must be 4 digits."; return; }
    if (btoa(buf) === SECRET) { st.won = true; }
    else {
      st.used++;
      card.classList.remove("shake"); void card.offsetWidth; card.classList.add("shake");
      const left = MAX - st.used;
      msg.textContent = left ? `❌ Wrong PIN. ${left} attempt${left > 1 ? "s" : ""} left.` : "";
    }
    buf = ""; save(); render();
  }

  document.addEventListener("keydown", e => {
    if (/^\d$/.test(e.key)) press(e.key);
    else if (e.key === "Backspace") press("C");
    else if (e.key === "Enter") press("OK");
  });
  render();
})();
</script>
</body>
</html>
